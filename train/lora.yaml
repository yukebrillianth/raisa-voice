# Official conf/voxcpm_v2/voxcpm_finetune_lora.yaml, with paths, a checkpoint every 100 steps
# and fewer loader workers. 1000 steps x 16 samples is about 178 passes over 90 clips: the
# checkpoint is picked by measured speech, not by loss.
pretrained_path: /hf/hub/models--openbmb--VoxCPM2/snapshots/7936080b41163874f38610f46f438e2c0757f9fd
train_manifest: /data/train.jsonl
val_manifest: /data/holdout.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 2
grad_accum_steps: 8
num_workers: 4
preprocessing_num_workers: 4
num_iters: 1000
log_interval: 10
valid_interval: 100
save_interval: 100
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 100
max_steps: 1000
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: /ckpt
tensorboard: /ckpt/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
